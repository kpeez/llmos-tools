name: tools

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: cli

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: cli/.tool-versions
      - run: bun install --frozen-lockfile
      - name: Version fields and CHANGELOG agree
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: bun scripts/release.ts check --base "origin/${BASE_REF:-main}"
      - name: Marketplace catalogs match the plugin manifest
        run: |
          bun scripts/gen-marketplaces.ts
          git diff --exit-code ../.claude-plugin/marketplace.json ../.agents/plugins/marketplace.json
      - run: bun run typecheck
      - run: bunx biome ci ..
      - name: Tests, including the contract snapshots
        run: bun test
      - name: Hook and MCP launcher bundles match their source
        run: |
          bun run build:hooks
          bun run build:mcp
          git diff --exit-code ../dist/hooks.js ../dist/mcp.js
      - name: Smoke the CLI and its subcommands
        run: |
          bun bin/llmos.ts --help >/dev/null
          bun bin/llmos.ts doctor --help >/dev/null
          bun bin/llmos.ts audit --help >/dev/null
          bun bin/llmos.ts daily activity --help >/dev/null

  # The TLA+ model checks (`just verify-models`), in their own job so that the
  # check job stays fast. The jar and Java match the pins in each check.ts.
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: cli/.tool-versions
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Download tla2tools 1.7.4 and check its sha256
        run: |
          jar="$RUNNER_TEMP/tla2tools.jar"
          curl -fsSL -o "$jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $jar" | sha256sum -c -
          echo "TLA2TOOLS=$jar" >> "$GITHUB_ENV"
      - name: Model checks
        run: bun scripts/verify-models.ts
