name: tools

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: cli

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: cli/.tool-versions
      - run: bun install --frozen-lockfile
      - name: Marketplace catalogs match the plugin manifest
        run: |
          bun scripts/gen-marketplaces.ts
          git diff --exit-code ../.claude-plugin/marketplace.json ../.agents/plugins/marketplace.json
      - run: bun run typecheck
      - run: bunx biome ci ..
      - name: Tests, including the contract snapshots
        run: bun test
      - name: Hook and MCP launcher bundles match their source
        run: |
          bun run build:hooks
          bun run build:mcp
          git diff --exit-code ../dist/hooks.js ../dist/mcp.js
      - name: Smoke the CLI and its subcommands
        run: |
          bun bin/llmos.ts --help >/dev/null
          bun bin/llmos.ts doctor --help >/dev/null
          bun bin/llmos.ts audit --help >/dev/null
          bun bin/llmos.ts daily activity --help >/dev/null
