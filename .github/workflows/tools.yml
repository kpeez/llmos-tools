name: tools

on:
  push:
    paths: ["tools/**", ".claude-plugin/**", ".agents/plugins/**", ".github/workflows/tools.yml"]
  pull_request:
    paths: ["tools/**", ".claude-plugin/**", ".agents/plugins/**", ".github/workflows/tools.yml"]

defaults:
  run:
    working-directory: tools

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Marketplace catalogs match the plugin manifest
        run: |
          bun scripts/gen-marketplaces.ts
          git diff --exit-code ../.claude-plugin/marketplace.json ../.agents/plugins/marketplace.json
      - run: bun run typecheck
      - run: bunx biome ci
      - name: Tests, including the contract snapshots
        run: bun test
      - name: Hook and MCP launcher bundles match their source
        run: |
          bun run build:hooks
          bun run build:mcp
          git diff --exit-code dist/hooks.js dist/mcp.js
      - name: Smoke the CLI entry points
        run: |
          for entry in bin/llmos-vault.ts bin/llmos-audit.ts bin/llmos-doctor.ts src/digest.ts; do
            bun "$entry" --help >/dev/null
          done
