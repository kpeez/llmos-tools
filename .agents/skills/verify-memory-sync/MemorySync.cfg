\* The memory sync with its writers, without the digest push.
\* scripts/check.ts sets Ids = "names" (the mutant) and Mutex = FALSE.
CONSTANTS
  Runs = {"s1", "s2"}
  MemEdits = {"m1"}
  RemoteEdits = {"r1", "r2"}
  PrivateEdits = {"p1"}
  DigestEdits = {"d1"}
  Digest = FALSE
  Ids = "fixed"
  Mutex = TRUE
INIT Init
NEXT Next
INVARIANT TypeOK
INVARIANT NoRemoteRevert
INVARIANT NoLocalLoss
INVARIANT OnlyCheckedPush
