\* The memory sync with the digest push (`pushNotes`) as one more writer.
\* scripts/check.ts sets Digest = "rebase" (the mutant) and Mutex = FALSE.
\* One remote edit keeps the run short: the digest adds a whole run.
CONSTANTS
  Runs = {"s1", "s2"}
  MemEdits = {"m1"}
  RemoteEdits = {"r1"}
  PrivateEdits = {"p1"}
  DigestEdits = {"d1"}
  Digest = "publish"
  Ids = "fixed"
  Mutex = TRUE
INIT Init
NEXT Next
INVARIANT TypeOK
INVARIANT NoRemoteRevert
INVARIANT NoLocalLoss
INVARIANT OnlyCheckedPush
